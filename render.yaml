services:
  - type: web
    name: controlpeso-mailer
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MOCK_MAIL
        value: "false"
      - key: APPT_TIMEZONE
        value: "America/Caracas"
      - key: API_TOKEN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_DEFAULT_FROM
        value: soporte@controlpeso.com.ve
      - key: RESEND_DEFAULT_NAME
        value: Doctora Flor
      - key: EXPO_ACCESS_TOKEN
        sync: false
